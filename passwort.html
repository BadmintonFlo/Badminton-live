</head><body><header>🏸 Badminton Mannschaftsverwaltung</header><main><div class="card"><h1>🔑 Passwort zurücksetzen</h1><p>Hier kannst du ein neues Passwort festlegen. <strong>Das alte Passwort wird nicht benötigt.</strong></p><div id="checking" class="info">Reset-Link wird geprüft …</div><div id="formArea"><form onsubmit="savePassword(event)"><label for="password">Neues Passwort</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="password2">Neues Passwort wiederholen</label><input id="password2" type="password" autocomplete="new-password" minlength="8" required><button id="saveBtn" type="submit">Neues Passwort speichern</button><div id="error" class="error"></div><div id="success" class="success">Passwort erfolgreich geändert. Du wirst aus der Reset-Sitzung abgemeldet.</div></form><button id="homeBtn" class="secondary" type="button" onclick="leaveReset()">🏠 Zum Hauptmenü</button></div></div></main><script>const SUPABASE_URL='https://apsarswjmsrmffoyxsgr.supabase.co';const SUPABASE_KEY='sb_publishable_yN9CDCZEHrCkCVMb87SkRg_hQjPjNmj';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);function showError(msg){const e=document.getElementById('error');e.textContent=msg;e.style.display='block'}function clearError(){document.getElementById('error').style.display='none'}async function prepare(){const checking=document.getElementById('checking');const {data:{session}}=await sb.auth.getSession();if(session){checking.style.display='none';document.getElementById('formArea').style.display='block';return}checking.textContent='Der Reset-Link ist ungültig oder abgelaufen. Bitte fordere einen neuen Passwort-Link an.';checking.style.color='#b42318';checking.style.background='#fff0ee'}async function savePassword(e){e.preventDefault();clearError();const p1=document.getElementById('password').value,p2=document.getElementById('password2').value;if(p1.length<8){showError('Das Passwort muss mindestens 8 Zeichen lang sein.');return}if(p1!==p2){showError('Die Passwörter stimmen nicht überein.');return}const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Wird gespeichert …';const {data:{session}}=await sb.auth.getSession();if(!session){btn.disabled=false;btn.textContent='Neues Passwort speichern';showError('Die Reset-Sitzung ist nicht mehr gültig. Bitte fordere einen neuen Link an.');return}const {error}=await sb.auth.updateUser({password:p1});if(error){btn.disabled=false;btn.textContent='Neues Passwort speichern';showError('Passwort konnte nicht geändert werden: '+error.message);return}document.getElementById('success').style.display='block';document.getElementById('password').value='';document.getElementById('password2').value='';await sb.auth.signOut();btn.textContent='Passwort geändert';document.getElementById('homeBtn').textContent='🏠 Zum Login'}async function leaveReset(){await sb.auth.signOut();window.location.replace('index.html')}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){document.getElementById('checking').style.display='none';document.getElementById('formArea').style.display='block'}});prepare();</script>
<script>(function(){const key='badminton-theme';function systemTheme(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}let saved=null;try{saved=localStorage.getItem(key)}catch(e){}document.documentElement.dataset.theme=saved==='dark'||saved==='light'?saved:systemTheme();if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: dark)');const changed=()=>{let v=null;try{v=localStorage.getItem(key)}catch(e){}if(v!=='dark'&&v!=='light')document.documentElement.dataset.theme=systemTheme()};if(mq.addEventListener)mq.addEventListener('change',changed);else if(mq.addListener)mq.addListener(changed)}})();</script>
