<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Passwort ändern</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#1769aa;--border:#dbe3ee;--danger:#b42318;--ok:#087443}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:#fff;border-bottom:1px solid var(--border)}.header-inner{max-width:700px;margin:auto;padding:12px 16px;font-weight:800}.wrap{max-width:620px;margin:auto;padding:28px 16px 45px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 3px 12px rgba(20,40,70,.05)}h1{margin:0 0 8px;font-size:25px}.sub{color:var(--muted);line-height:1.45;margin-bottom:18px}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cfd8e3;border-radius:10px;font:inherit}button,a{border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{width:100%;margin-top:18px;background:var(--primary);color:#fff}.home{width:100%;margin-top:16px;background:#eef2f7;color:#26364d}.status{margin-top:14px;padding:11px 12px;border-radius:10px;line-height:1.4}.ok{color:var(--ok);background:#ecfdf3;border:1px solid #b7ebcc}.bad{color:var(--danger);background:#fff0ee;border:1px solid #ffd1cc}.info{color:#1769aa;background:#eef7ff;border:1px solid #c8e0f6}.hidden{display:none!important}.note{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.45}</style></head><body><header><div class="header-inner">🏸 Badminton Mannschaftsverwaltung</div></header><div class="wrap"><div class="card"><h1>🔑 Passwort ändern</h1><div id="intro" class="sub">Hier kannst du dein persönliches Passwort ändern.</div><div id="normal"><label for="current">Aktuelles Passwort</label><input id="current" type="password" autocomplete="current-password"><label for="next">Neues Passwort</label><input id="next" type="password" minlength="8" autocomplete="new-password"><label for="confirm">Neues Passwort wiederholen</label><input id="confirm" type="password" minlength="8" autocomplete="new-password"><button id="change" class="primary" onclick="changePassword()">Passwort ändern</button></div><div id="recovery" class="hidden"><label for="rnext">Neues Passwort</label><input id="rnext" type="password" minlength="8" autocomplete="new-password"><label for="rconfirm">Neues Passwort wiederholen</label><input id="rconfirm" type="password" minlength="8" autocomplete="new-password"><button id="save" class="primary" onclick="saveRecovery()">Neues Passwort speichern</button></div><div id="status" class="status hidden"></div><a class="home" href="index.html">🏠 Zurück zum Hauptmenü</a><div class="note">Passwörter werden ausschließlich über Supabase Auth verwaltet.</div></div></div><script>const sb=window.supabase.createClient('https://apsarswjmsrmffoyxsgr.supabase.co','sb_publishable_yN9CDCZEHrCkCVMb87SkRg_hQjPjNmj');const $=id=>document.getElementById(id);function msg(t,c){$('status').textContent=t;$('status').className='status '+c}function pair(a,b){if(!a||a.length<8){msg('Das neue Passwort muss mindestens 8 Zeichen lang sein.','bad');return false}if(a!==b){msg('Die beiden neuen Passwörter stimmen nicht überein.','bad');return false}return true}async function changePassword(){const cur=$('current').value,n=$('next').value,c=$('confirm').value;if(!cur){msg('Bitte dein aktuelles Passwort eingeben.','bad');return}if(!pair(n,c))return;const {data:{user}}=await sb.auth.getUser();if(!user?.email){msg('Bitte zuerst anmelden.','bad');return}$('change').disabled=true;$('change').textContent='Wird geändert …';const re=await sb.auth.signInWithPassword({email:user.email,password:cur});if(re.error){$('change').disabled=false;$('change').textContent='Passwort ändern';msg('Das aktuelle Passwort ist nicht korrekt.','bad');return}const {error}=await sb.auth.updateUser({password:n});$('change').disabled=false;$('change').textContent='Passwort ändern';if(error){msg('Passwort konnte nicht geändert werden: '+error.message,'bad');return}$('current').value='';$('next').value='';$('confirm').value='';msg('Passwort erfolgreich geändert.','ok')}async function saveRecovery(){const n=$('rnext').value,c=$('rconfirm').value;if(!pair(n,c))return;$('save').disabled=true;$('save').textContent='Wird gespeichert …';const {error}=await sb.auth.updateUser({password:n});$('save').disabled=false;$('save').textContent='Neues Passwort speichern';if(error){msg('Passwort konnte nicht gesetzt werden: '+error.message,'bad');return}msg('Passwort erfolgreich gesetzt. Du kannst dich jetzt wieder anmelden.','ok');$('rnext').value='';$('rconfirm').value=''}(async()=>{const {data:{session}}=await sb.auth.getSession();const recovery=(location.hash||'').includes('type=recovery');if(recovery){$('normal').classList.add('hidden');$('recovery').classList.remove('hidden');$('intro').textContent='Über den Passwort-Reset-Link kannst du jetzt ein neues Passwort festlegen.';return}if(!session?.user){$('normal').classList.add('hidden');msg('Bitte zuerst anmelden.','bad')}})();</script></body></html>
