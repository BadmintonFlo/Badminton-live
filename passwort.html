<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Passwort zurücksetzen – Badminton</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#1769aa;--primary2:#0d4f83;--border:#dbe3ee;--danger:#b42318;--success:#067647}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}header{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;font-weight:800}main{width:min(460px,calc(100% - 28px));margin:40px auto}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(20,40,70,.08)}h1{margin:0 0 8px;font-size:25px}p{color:var(--muted);line-height:1.45}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #cfd8e3;border-radius:10px;font:inherit;background:#fff}button{width:100%;border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer;margin-top:18px;background:var(--primary);color:#fff}button:hover{background:var(--primary2)}.secondary{background:#eef2f7;color:#26364d}.error{display:none;margin-top:12px;color:var(--danger);background:#fff0ee;border:1px solid #ffd1cc;padding:10px;border-radius:10px}.success{display:none;margin-top:12px;color:var(--success);background:#ecfdf3;border:1px solid #abefc6;padding:10px;border-radius:10px}.info{background:#f8fafc;border-radius:10px;padding:10px;margin-top:12px;font-size:14px;color:var(--muted)}#formArea{display:none}</style></head><body><header>🏸 Badminton Mannschaftsverwaltung</header><main><div class="card"><h1>🔑 Passwort zurücksetzen</h1><p>Hier kannst du ein neues Passwort festlegen. <strong>Das alte Passwort wird nicht benötigt.</strong></p><div id="checking" class="info">Reset-Link wird geprüft …</div><div id="formArea"><form onsubmit="savePassword(event)"><label for="password">Neues Passwort</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="password2">Neues Passwort wiederholen</label><input id="password2" type="password" autocomplete="new-password" minlength="8" required><button id="saveBtn" type="submit">Neues Passwort speichern</button><div id="error" class="error"></div><div id="success" class="success">Passwort erfolgreich geändert. Du wirst aus der Reset-Sitzung abgemeldet.</div></form><button id="homeBtn" class="secondary" type="button" onclick="leaveReset()">🏠 Zum Hauptmenü</button></div></div></main><script>const SUPABASE_URL='https://apsarswjmsrmffoyxsgr.supabase.co';const SUPABASE_KEY='sb_publishable_yN9CDCZEHrCkCVMb87SkRg_hQjPjNmj';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);function showError(msg){const e=document.getElementById('error');e.textContent=msg;e.style.display='block'}function clearError(){document.getElementById('error').style.display='none'}async function prepare(){const checking=document.getElementById('checking');const {data:{session}}=await sb.auth.getSession();if(session){checking.style.display='none';document.getElementById('formArea').style.display='block';return}checking.textContent='Der Reset-Link ist ungültig oder abgelaufen. Bitte fordere einen neuen Passwort-Link an.';checking.style.color='#b42318';checking.style.background='#fff0ee'}async function savePassword(e){e.preventDefault();clearError();const p1=document.getElementById('password').value,p2=document.getElementById('password2').value;if(p1.length<8){showError('Das Passwort muss mindestens 8 Zeichen lang sein.');return}if(p1!==p2){showError('Die Passwörter stimmen nicht überein.');return}const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Wird gespeichert …';const {data:{session}}=await sb.auth.getSession();if(!session){btn.disabled=false;btn.textContent='Neues Passwort speichern';showError('Die Reset-Sitzung ist nicht mehr gültig. Bitte fordere einen neuen Link an.');return}const {error}=await sb.auth.updateUser({password:p1});if(error){btn.disabled=false;btn.textContent='Neues Passwort speichern';showError('Passwort konnte nicht geändert werden: '+error.message);return}document.getElementById('success').style.display='block';document.getElementById('password').value='';document.getElementById('password2').value='';await sb.auth.signOut();btn.textContent='Passwort geändert';document.getElementById('homeBtn').textContent='🏠 Zum Login'}async function leaveReset(){await sb.auth.signOut();window.location.replace('index.html')}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){document.getElementById('checking').style.display='none';document.getElementById('formArea').style.display='block'}});prepare();</script></body></html>
