.game{border:1px solid #dbe3ea;border-radius:16px;padding:15px;margin-top:12px;background:#fff}
.game.active{border:2px solid #f59e0b;background:#fffaf0}
.game.finished{border-color:#bbf7d0;background:#f7fff9}

.game-status{font-size:12px;margin-top:7px;color:#64748b}

.set.active{background:#fff7ed;outline:1px solid #fdba74}
.set-name{font-size:11px;color:#64748b}
.set-score{font-size:22px;font-weight:850;margin-top:2px}
.set.empty{color:#94a3b8}
.update{margin-top:10px;text-align:center;font-size:12px;color:#64748b}

<script>

const SUPABASE_URL="https://apsarswjmsrmffoyxsgr.supabase.co";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const ORDER=["HD1","HD2","DD","HE1","HE2","HE3","DE","GD"];
const LABELS={
 HD1:"1. Herrendoppel",HD2:"2. Herrendoppel",DD:"Damendoppel",

};

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function dateDE(v){
 if(!v)return "";
 try{return new Date(v+"T00:00:00").toLocaleDateString("de-DE");}
 catch(e){return v}
}
function setScore(g,n){
 const h=g[`set${n}_home`],a=g[`set${n}_away`];
 if(h==null||a==null)return null;
 return `${h}:${a}`;
}
function isCompletedSetScore(h,a){
 if(h==null||a==null)return false;
 h=Number(h);a=Number(a);
 if(!Number.isInteger(h)||!Number.isInteger(a)||h<0||a<0||h>30||a>30||h===a)return false;
 const hi=Math.max(h,a),lo=Math.min(h,a);
 return (hi===21&&lo<=19)||(hi>=22&&hi<=29&&hi-lo===2)||(hi===30&&lo>=28);
}
function setWins(g){
 let h=0,a=0;
 for(let n=1;n<=3;n++){
  const x=g[`set${n}_home`],y=g[`set${n}_away`];
  if(!isCompletedSetScore(x,y))continue;
  if(Number(x)>Number(y))h++;
  else if(Number(y)>Number(x))a++;
 }
 return {h,a};
}
function winner(g){
 const s=setWins(g);
 return s.h>=2?"home":s.a>=2?"away":null;
}
function isSetActive(g,n){
 if(g.status==="finished")return false;
 if(g[`set${n}_home`]!=null&&g[`set${n}_away`]!=null)return false;
 if(n===1)return true;
 const prevH=g[`set${n-1}_home`],prevA=g[`set${n-1}_away`];
 if(prevH==null||prevA==null)return false;
 return !winner(g);
}
function render(m,games){
 games.sort((a,b)=>ORDER.indexOf(a.position)-ORDER.indexOf(b.position));

 games.forEach(g=>{const w=winner(g);if(w==="home")home++;if(w==="away")away++});
 const done=games.filter(g=>g.status==="finished").length;
 const active=games.find(g=>g.status==="live");
 const status=m.status==="live"?"live":m.status==="finished"?"finished":"";
 const statusText=m.status==="live"?"🔴 LIVE":m.status==="finished"?"✅ BEendet":"⏳ Geplant";

 document.getElementById("content").innerHTML=`
 <div class="card match-head">

   <div class="teams">
     <div class="team">${esc(m.home_team)}</div>
     <div class="big-score">${home} : ${away}</div>
     <div class="team">${esc(m.away_team)}</div>
   </div>
   <div class="meta">${m.match_date?esc(dateDE(m.match_date)):""}${m.match_time?" · "+esc(String(m.match_time).slice(0,5))+" Uhr":""}</div>
   <div class="progress"><div style="width:${Math.round(done/8*100)}%"></div></div>
   <div class="score-note">${done} von 8 Spielen beendet${active?" · "+esc(LABELS[active.position]||active.position)+" läuft":""}</div>
 </div>

 <div class="card">
   <h2>Spiele</h2>
   ${games.map(g=>renderGame(g,m)).join("")}
   <div class="update" id="updated">Automatische Aktualisierung aktiv</div>
 </div>`;
}
function renderGame(g,m){
 const w=winner(g),sw=setWins(g);
 const active=g.status==="live"&&!w;
 const cls=w?"finished":active?"active":"";
 const state=w?(w==="home"?`${esc(m.home_team)} gewinnt · ${sw.h}:${sw.a}`:`${esc(m.away_team)} gewinnt · ${sw.h}:${sw.a}`)
   :active?"🔴 läuft":"⏳ offen";
 const sets=[1,2,3].map(n=>{
  const s=setScore(g,n), activeSet=isSetActive(g,n);
  return `<div class="set ${s?"":"empty"} ${activeSet?"active":""}">
    <div class="set-name">Satz ${n}${activeSet?" · LIVE":""}</div>
    <div class="set-score">${s||"– : –"}</div>
  </div>`;
 }).join("");
 return `<div class="game ${cls}">
   <div class="game-top">
    <div><div class="position">${esc(LABELS[g.position]||g.position)}</div>
    <div class="players"><strong>${esc(m.home_team)}:</strong> ${esc(g.player1||"–")}${g.player2?" / "+esc(g.player2):""}</div>
    <div class="players"><strong>${esc(m.away_team)}:</strong> ${esc(g.opponent_player1||"–")}${g.opponent_player2?" / "+esc(g.opponent_player2):""}</div></div>
    <div class="game-score">${sw.h} : ${sw.a}</div>
   </div>
   <div class="game-status">${state}</div>
   <div class="sets">${sets}</div>
 </div>`;
}
async function loadMatch(id){
 const {data:m,error:me}=await sb.from("matches").select("*").eq("id",id).maybeSingle();
 if(me||!m){
   document.getElementById("content").innerHTML=
     '<div class="card"><div class="status bad">Begegnung konnte nicht geladen werden.</div>'+
     '<button onclick="load()" style="margin-top:12px;padding:11px 14px;border:0;border-radius:10px;background:#e2e8f0;font-weight:700">← Zurück</button></div>';
   return;
 }
 if(String(m.status||"").toLowerCase()!=="live" && !(isAdmin && showFinished && String(m.status||"").toLowerCase()==="finished")){
   document.getElementById("content").innerHTML=
     '<div class="card"><h1>🏸 Badminton Live-Ticker</h1>'+
     '<div class="status" style="margin-top:12px">Diese Begegnung ist aktuell nicht live und wird deshalb hier nicht angezeigt.</div>'+
     '<button onclick="currentId=null;load()" style="margin-top:12px;padding:11px 14px;border:0;border-radius:10px;background:#e2e8f0;font-weight:700">← Zu den Live-Spielen</button></div>';
   return;
 }
 const {data:games,error:ge}=await sb.from("match_games").select("*").eq("match_id",id);
 if(ge){
   document.getElementById("content").innerHTML=
     '<div class="card"><div class="status bad">Spiele konnten nicht geladen werden.</div>'+
     '<button onclick="load()" style="margin-top:12px;padding:11px 14px;border:0;border-radius:10px;background:#e2e8f0;font-weight:700">← Zurück</button></div>';
   return;
 }
 render(m,games||[]);
 document.title=`${m.home_team} – ${m.away_team} · Live`;
}

async function load(){
 currentId=currentId||
           new URLSearchParams(location.search).get("match")||
           new URLSearchParams(location.search).get("live");

 // Wenn kein Match in der URL steht, zeigen wir eine öffentliche Auswahl.
 if(!currentId){
   const {data:list,error}=await sb.from("matches")
     .select("id,home_team,away_team,match_date,match_time,status")
     .order("match_date",{ascending:true})
     .order("match_time",{ascending:true})
     .limit(30);

   if(error){
     document.getElementById("content").innerHTML=
       '<div class="card"><h1>Badminton Live-Ticker</h1>'+
       '<div class="status bad" style="margin-top:12px">Begegnungen konnten nicht geladen werden.</div></div>';
     return;
   }

   const shown=(list||[]).filter(m=>String(m.status||"").toLowerCase()==="live" || (isAdmin && showFinished && String(m.status||"").toLowerCase()==="finished"))
     .sort((a,b)=>String(a.match_date||"9999-12-31").localeCompare(String(b.match_date||"9999-12-31")) || String(a.match_time||"00:00").slice(0,5).localeCompare(String(b.match_time||"00:00").slice(0,5)));

   document.getElementById("content").innerHTML=
    '<div class="card">'+
      '<h1>🏸 Badminton Live-Ticker</h1>'+
      '<div class="small" style="margin-top:6px">Bitte Begegnung auswählen.</div>'+
      (isAdmin ? `<label class="admin-toggle"><input type="checkbox" ${showFinished?"checked":""} onchange="toggleFinished(this.checked)"><span>Beendete Spiele anzeigen</span></label>` : '')+
      '<div id="matchList" style="display:grid;gap:10px;margin-top:14px">'+
      (shown.length ? shown.map(m=>`
        <button onclick="openMatch('${esc(m.id)}')"
          style="text-align:left;background:#fff;border:1px solid #dbe3ea;border-radius:14px;padding:14px">
          <div style="font-size:17px;font-weight:850">${esc(m.home_team)} – ${esc(m.away_team)}</div>
          <div class="small" style="margin-top:4px">
            ${m.match_date?esc(dateDE(m.match_date)):""}
            ${m.match_time?" · "+esc(String(m.match_time).slice(0,5))+" Uhr":""}
            · ${m.status==="live"?"🔴 LIVE":m.status==="finished"?"✅ beendet":"⏳ geplant"}
          </div>
        </button>`).join("")
        : '<div class="status">'+(showFinished&&isAdmin?'Keine Live-Spiele oder angezeigten beendeten Begegnungen.':'Aktuell läuft keine Begegnung live.')+'</div>')+
      '</div>'+
      '<div class="update" style="margin-top:14px">Die Anzeige aktualisiert sich automatisch.</div>'+
    '</div>';
   document.title="Badminton Live-Ticker";
   return;
 }

 await loadMatch(currentId);
}

async function toggleFinished(value){
  if(!isAdmin)return;
  showFinished=!!value;
  currentId=null;
  await load();
}
async function openMatch(id){
 currentId=id;
 await loadMatch(id);
 subscribe();
}

function subscribe(){
 if(channel)sb.removeChannel(channel);
 if(!currentId)return;

 channel=sb.channel("public-live-"+currentId)
   .on("postgres_changes",{event:"*",schema:"public",table:"matches",
      filter:"id=eq."+currentId},()=>loadMatch(currentId))
   .on("postgres_changes",{event:"*",schema:"public",table:"match_games",
      filter:"match_id=eq."+currentId},()=>loadMatch(currentId))
   .subscribe();
}
function ensureChatUi(){
 if(!currentUser || document.getElementById("chatFab"))return;
 document.body.insertAdjacentHTML("beforeend",`<button id="chatFab" class="chat-fab" onclick="openChat()">💬 Live-Chat</button>
 <div id="chatModal" class="chat-modal" role="dialog" aria-modal="true"><div class="chat-panel"><div class="chat-head"><h2>Live-Chat</h2><button onclick="closeChat()" style="border:0;border-radius:9px;padding:9px 12px;background:#e2e8f0">Schließen</button></div><div id="chatMessages" class="chat-messages"><div class="small">Chat wird geladen …</div></div><form class="chat-compose" onsubmit="sendChat(event)"><input id="chatInput" maxlength="1000" placeholder="Nachricht schreiben …" required><button style="background:#0f766e;color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:800">Senden</button></form><div id="chatStatus" class="small">Nur angemeldete Benutzer können Nachrichten senden.</div></div></div>`);
}
function openChat(){if(!currentUser){alert("Bitte anmelden, um den Chat zu nutzen.");return;} if(!currentId){alert("Bitte zuerst eine Begegnung öffnen.");return;}document.getElementById("chatModal").classList.add("open");loadChat();subscribeChat();}
function closeChat(){document.getElementById("chatModal")?.classList.remove("open");if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null;}}
async function loadChat(){
 const box=document.getElementById("chatMessages");if(!box||!currentId)return;
 const {data,error}=await sb.from("live_chat_messages").select("id,match_id,user_id,display_name,message,created_at").eq("match_id",currentId).order("created_at",{ascending:true}).limit(200);
 if(error){box.innerHTML='<div class="status bad">Chat ist noch nicht eingerichtet oder nicht freigegeben. Bitte Supabase-Tabelle und Zugriffsrichtlinien konfigurieren.</div>';return;}
 box.innerHTML=(data||[]).map(m=>`<div class="chat-message"><b>${esc(m.display_name||"Nutzer")} · ${esc(new Date(m.created_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}))}</b>${esc(m.message)}</div>`).join("")||'<div class="small">Noch keine Nachrichten.</div>';box.scrollTop=box.scrollHeight;
}
function subscribeChat(){if(chatChannel||!currentId)return;chatChannel=sb.channel("chat-"+currentId).on("postgres_changes",{event:"INSERT",schema:"public",table:"live_chat_messages",filter:"match_id=eq."+currentId},()=>loadChat()).subscribe();}
async function chatDisplayName(){
 const {data:links}=await sb.from("player_accounts").select("player_id").eq("user_id",currentUser.id).eq("active",true).limit(1);
 if(links?.length){
   const {data:player}=await sb.from("players").select("name").eq("id",links[0].player_id).maybeSingle();
   if(player?.name)return player.name;
 }
 const {data:profile}=await sb.from("profiles").select("display_name,full_name,name").eq("id",currentUser.id).maybeSingle();
 return profile?.display_name||profile?.full_name||profile?.name||currentUser.user_metadata?.display_name||currentUser.email?.split("@")[0]||"Nutzer";
}
async function sendChat(e){
 e.preventDefault();if(!currentUser||!currentId)return;
 const input=document.getElementById("chatInput"),message=input.value.trim();if(!message)return;
 const display_name=await chatDisplayName();
 const {error}=await sb.from("live_chat_messages").insert({match_id:currentId,user_id:currentUser.id,display_name,message});
 if(error){document.getElementById("chatStatus").textContent="Nachricht konnte nicht gesendet werden. Chat-Berechtigungen prüfen.";return;}
 input.value="";await loadChat();
}
async function initIdentity(){
 const {data:{session}}=await sb.auth.getSession();currentUser=session?.user||null;
 if(currentUser){const {data:profile}=await sb.from("profiles").select("role").eq("id",currentUser.id).maybeSingle();isAdmin=profile?.role==="admin";ensureChatUi();}
 sb.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;isAdmin=false;if(currentUser){const {data:profile}=await sb.from("profiles").select("role").eq("id",currentUser.id).maybeSingle();isAdmin=profile?.role==="admin";ensureChatUi();}else{document.getElementById("chatFab")?.remove();document.getElementById("chatModal")?.remove();isAdmin=false;showFinished=false;}await load();});
}
(async()=>{await initIdentity();await load();if(currentId)subscribe()})();
</script>

<script>(function(){const key='badminton-theme';function systemTheme(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}let saved=null;try{saved=localStorage.getItem(key)}catch(e){}document.documentElement.dataset.theme=saved==='dark'||saved==='light'?saved:systemTheme();if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: dark)');const changed=()=>{let v=null;try{v=localStorage.getItem(key)}catch(e){}if(v!=='dark'&&v!=='light')document.documentElement.dataset.theme=systemTheme()};if(mq.addEventListener)mq.addEventListener('change',changed);else if(mq.addListener)mq.addListener(changed)}})();</script>
