<main class="page" id="content">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const SUPABASE_URL="https://apsarswjmsrmffoyxsgr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_yN9CDCZEHrCkCVMb87SkRg_hQjPjNmj";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const ORDER=["HD1","HD2","DD","HE1","HE2","HE3","DE","GD"];
const LABELS={
 HD1:"1. Herrendoppel",HD2:"2. Herrendoppel",DD:"Damendoppel",
 HE1:"1. Herreneinzel",HE2:"2. Herreneinzel",HE3:"3. Herreneinzel",
 DE:"Dameneinzel",GD:"Gemischtes Doppel"
};
let channel=null;
let currentId=null;
let currentUser=null, isAdmin=false, showFinished=false, chatChannel=null;

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function dateDE(v){
 if(!v)return "";
 try{return new Date(v+"T00:00:00").toLocaleDateString("de-DE");}
 catch(e){return v}
}
function setScore(g,n){
 const h=g[`set${n}_home`],a=g[`set${n}_away`];
 if(h==null||a==null)return null;
 return `${h}:${a}`;
}
function isCompletedSetScore(h,a){
 if(h==null||a==null)return false;
 h=Number(h);a=Number(a);
 if(!Number.isInteger(h)||!Number.isInteger(a)||h<0||a<0||h>30||a>30||h===a)return false;
 const hi=Math.max(h,a),lo=Math.min(h,a);
 return (hi===21&&lo<=19)||(hi>=22&&hi<=29&&hi-lo===2)||(hi===30&&lo>=28);
}
function setWins(g){
 let h=0,a=0;
 for(let n=1;n<=3;n++){
  const x=g[`set${n}_home`],y=g[`set${n}_away`];
  if(!isCompletedSetScore(x,y))continue;
  if(Number(x)>Number(y))h++;
  else if(Number(y)>Number(x))a++;
 }
 return {h,a};
}
function winner(g){
 const s=setWins(g);
 return s.h>=2?"home":s.a>=2?"away":null;
}
function isSetActive(g,n){
 if(g.status==="finished")return false;
 if(g[`set${n}_home`]!=null&&g[`set${n}_away`]!=null)return false;
 if(n===1)return true;
 const prevH=g[`set${n-1}_home`],prevA=g[`set${n-1}_away`];
 if(prevH==null||prevA==null)return false;
 return !winner(g);
}
function render(m,games){
 games.sort((a,b)=>ORDER.indexOf(a.position)-ORDER.indexOf(b.position));
 let home=0,away=0;
 games.forEach(g=>{const w=winner(g);if(w==="home")home++;if(w==="away")away++});
 const done=games.filter(g=>g.status==="finished").length;
 const active=games.find(g=>g.status==="live");
 const status=m.status==="live"?"live":m.status==="finished"?"finished":"";
 const statusText=m.status==="live"?"🔴 LIVE":m.status==="finished"?"✅ Beendet":"⏳ Geplant";

 document.getElementById("content").innerHTML=`
 <section class="welcome">
   <div class="welcome-copy">
     <p class="eyebrow">BADMINTON · VEREINSPLATTFORM</p>
     <h1>🏸 ${esc(m.home_team)} – ${esc(m.away_team)}</h1>
     <p>${m.match_date?esc(dateDE(m.match_date)):""}${m.match_time?" · "+esc(String(m.match_time).slice(0,5))+" Uhr":""}</p>
   </div>
   <div class="welcome-mark" aria-hidden="true">🏸</div>
 </section>
 <section class="section">
   <div class="news-panel">
     <div class="section-head"><div><h2>Spielstand</h2><p>${statusText}</p></div><span class="badge">${home} : ${away}</span></div>
     <div class="info-card"><strong>${done} von 8 Spielen beendet</strong><p>${active?esc(LABELS[active.position]||active.position)+" läuft":"Spielübersicht"}</p></div>
     ${currentUser?`<div class="form-actions"><button type="button" class="btn primary" onclick="openChat('${esc(m.id)}')">💬 Chat zu dieser Begegnung</button></div>`:""}
   </div>
 </section>
 <section class="section">
   <div class="section-head"><div><h2>Spiele</h2><p>Einzelergebnisse und Satzstände</p></div></div>
   <div class="news-panel">
     ${games.map(g=>renderGame(g,m)).join("")}
     <p class="page-note" id="updated">Automatische Aktualisierung aktiv</p>
   </div>
 </section>`;
}
function renderGame(g,m){
 const w=winner(g),sw=setWins(g);
 const active=g.status==="live"&&!w;
 const state=w?(w==="home"?`${esc(m.home_team)} gewinnt · ${sw.h}:${sw.a}`:`${esc(m.away_team)} gewinnt · ${sw.h}:${sw.a}`)
   :active?"🔴 läuft":"⏳ offen";
 const sets=[1,2,3].map(n=>{
  const s=setScore(g,n), activeSet=isSetActive(g,n);
  return `<div class="info-card"><div><strong>Satz ${n}${activeSet?" · LIVE":""}</strong><p>${s||"– : –"}</p></div></div>`;
 }).join("");
 return `<article class="info-card">
   <div class="detail-grid">
    <strong>${esc(LABELS[g.position]||g.position)}</strong>
    <p>${esc(m.home_team)}: ${esc(g.player1||"–")}${g.player2?" / "+esc(g.player2):""}</p>
    <p>${esc(m.away_team)}: ${esc(g.opponent_player1||"–")}${g.opponent_player2?" / "+esc(g.opponent_player2):""}</p>
    <span class="badge">${sw.h} : ${sw.a} · ${state}</span>
    <div class="detail-grid">${sets}</div>
   </div>
 </article>`;
}

async function loadMatch(id){
 const {data:m,error:me}=await sb.from("matches").select("*").eq("id",id).maybeSingle();
 if(me||!m){
   document.getElementById("content").innerHTML=
     '<div class="card"><div class="status bad">Begegnung konnte nicht geladen werden.</div>'+
     '<button class="btn secondary" type="button" onclick="load()">← Zurück</button></div>';
   return;
 }
 if(!["live","finished"].includes(String(m.status||"").toLowerCase())){
   document.getElementById("content").innerHTML=
     '<div class="card"><h1>🏸 Badminton Live-Ticker</h1>'+
     '<div class="status">Diese Begegnung ist aktuell nicht live und wird deshalb hier nicht angezeigt.</div>'+
     '<button class="btn secondary" type="button" onclick="currentId=null;load()">← Zu den Live-Spielen</button></div>';
   return;
 }
 const {data:games,error:ge}=await sb.from("match_games").select("*").eq("match_id",id);
 if(ge){
   document.getElementById("content").innerHTML=
     '<div class="card"><div class="status bad">Spiele konnten nicht geladen werden.</div>'+
     '<button class="btn secondary" type="button" onclick="load()">← Zurück</button></div>';
   return;
 }
 render(m,games||[]);
 document.title=`${m.home_team} – ${m.away_team} · Live`;
}

async function load(){
 currentId=currentId||
           new URLSearchParams(location.search).get("match")||
           new URLSearchParams(location.search).get("live");

 // Ohne konkrete Begegnung wird die öffentliche Live-/Ergebnisübersicht angezeigt.
 if(!currentId){
   const {data:list,error}=await sb.from("matches")
     .select("id,home_team,away_team,match_date,match_time,status")
     .in("status",["live","finished"])
     .order("match_date",{ascending:false})
     .order("match_time",{ascending:false})
     .limit(100);

   if(error){
     console.error("Live-Begegnungen konnten nicht geladen werden:",error);
     document.getElementById("content").innerHTML=
       '<div class="card"><h1>Badminton Live-Ticker</h1>'+
       '<div class="status bad">Die Begegnungen konnten gerade nicht geladen werden. Bitte später erneut versuchen.</div>'+
       '<button class="btn secondary" type="button" onclick="currentId=null;load()">Erneut laden</button></div>';
     return;
   }

   const all=(list||[]).filter(m=>["live","finished"].includes(String(m.status||"").toLowerCase()));
   const live=all.filter(m=>String(m.status).toLowerCase()==="live");
   const finished=all.filter(m=>String(m.status).toLowerCase()==="finished");
   const shown=showFinished?finished:live;
   const dateSort=(a,b)=>String(b.match_date||"").localeCompare(String(a.match_date||"")) || String(b.match_time||"").slice(0,5).localeCompare(String(a.match_time||"").slice(0,5));
   shown.sort(dateSort);

   document.getElementById("content").innerHTML=`
    <section class="welcome">
      <div class="welcome-copy">
        <p class="eyebrow">BADMINTON · VEREINSPLATTFORM</p>
        <h1>🏸 Badminton Live-Ticker</h1>
        <p>Live-Begegnungen und abgeschlossene Spiele.</p>
      </div>
      <div class="welcome-mark" aria-hidden="true">🏸</div>
    </section>
    <section class="section">
      <div class="section-head"><div><h2>${showFinished?"Beendete Spiele":"Live-Begegnungen"}</h2><p>${showFinished?finished.length+" abgeschlossene Begegnung(en)":""+live.length+" laufende Begegnung(en)"}</p></div></div>
      <div class="form-actions" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <button type="button" class="btn ${showFinished?"secondary":"primary"}" aria-pressed="${!showFinished}" onclick="toggleFinished(false)">🔴 Live</button>
        <button type="button" class="btn ${showFinished?"primary":"secondary"}" aria-pressed="${showFinished}" onclick="toggleFinished(true)">✅ Beendete Spiele</button>
      </div>
      <div class="news-panel">
        <div class="detail-grid">
          ${shown.length ? shown.map(m=>`
            <button type="button" class="info-card live-match-link" onclick="openMatch('${esc(m.id)}')">
              <span class="big-icon">🏸</span>
              <span><strong>${esc(m.home_team)} – ${esc(m.away_team)}</strong>
              <p>${m.match_date?esc(dateDE(m.match_date)):""}${m.match_time?" · "+esc(String(m.match_time).slice(0,5))+" Uhr":""} · ${String(m.status).toLowerCase()==="live"?"🔴 LIVE":"✅ beendet"}</p></span>
            </button>`).join("") : `<div class="status">${showFinished?"Aktuell gibt es keine beendeten Spiele.":"Aktuell keine Live-Begegnungen."}</div>`}
        </div>
        <p class="page-note">Die Anzeige aktualisiert sich automatisch.</p>
      </div>
    </section>`;
   document.title="Badminton Live-Ticker";
   return;
 }

 await loadMatch(currentId);
}

async function toggleFinished(value){
  showFinished=!!value;
  currentId=null;
  await load();
}
async function openMatch(id){
 currentId=id;
 await loadMatch(id);
 subscribe();
}

function subscribe(){
 if(channel)sb.removeChannel(channel);
 if(!currentId)return;

 channel=sb.channel("public-live-"+currentId)
   .on("postgres_changes",{event:"*",schema:"public",table:"matches",
      filter:"id=eq."+currentId},()=>loadMatch(currentId))
   .on("postgres_changes",{event:"*",schema:"public",table:"match_games",
      filter:"match_id=eq."+currentId},()=>loadMatch(currentId))
   .subscribe();
}
let chatMatchId=null;
function ensureChatUi(){ /* Chat-Oberfläche wird erst beim Öffnen einer berechtigten Begegnung erzeugt. */ }
async function openChat(matchId){
 if(!currentUser){alert("Bitte anmelden, um den Begegnungs-Chat zu nutzen.");return;}
 const {data:match,error}=await sb.from("matches").select("id,home_team,away_team,status").eq("id",matchId).maybeSingle();
 if(error||!match||!["live","finished"].includes(String(match.status||"").toLowerCase())){alert("Der Chat ist nur für laufende oder beendete Begegnungen verfügbar.");return;}
 chatMatchId=match.id;
 let modal=document.getElementById("chatModal");
 if(!modal){
  document.body.insertAdjacentHTML("beforeend",`<div id="chatModal" class="chat-modal" role="dialog" aria-modal="true" aria-labelledby="chatTitle"><div class="chat-panel"><div class="chat-head"><div><h2 id="chatTitle">Begegnungs-Chat</h2><div id="chatMatchTitle" class="small"></div></div><button onclick="closeChat()">Schließen</button></div><div id="chatMessages" class="chat-messages"><div class="small">Chat wird geladen …</div></div><form class="chat-compose" onsubmit="sendChat(event)"><input id="chatInput" maxlength="1000" placeholder="Nachricht zu dieser Begegnung …" required><button>Senden</button></form><div id="chatStatus" class="small">Nachrichten gehören ausschließlich zu dieser Begegnung.</div></div></div>`);
  modal=document.getElementById("chatModal");
 }
 document.getElementById("chatMatchTitle").textContent=match.home_team+" – "+match.away_team;
 modal.classList.add("open");
 if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null;}
 await loadChat();subscribeChat();
}
function closeChat(){document.getElementById("chatModal")?.classList.remove("open");if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null;}chatMatchId=null;}
async function loadChat(){
 const box=document.getElementById("chatMessages");if(!box||!chatMatchId)return;
 const {data,error}=await sb.from("live_chat_messages").select("id,match_id,user_id,display_name,message,created_at").eq("match_id",chatMatchId).order("created_at",{ascending:true}).limit(200);
 if(error){box.innerHTML='<div class="status bad">Chat konnte nicht geladen werden. Bitte Chat-Berechtigungen prüfen.</div>';return;}
 box.innerHTML=(data||[]).map(m=>`<div class="chat-message"><b>${esc(m.display_name||"Nutzer")} · ${esc(new Date(m.created_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}))}</b>${esc(m.message)}</div>`).join("")||'<div class="small">Noch keine Nachrichten zu dieser Begegnung.</div>';box.scrollTop=box.scrollHeight;
}
function subscribeChat(){if(chatChannel||!chatMatchId)return;const subscribedId=chatMatchId;chatChannel=sb.channel("chat-"+subscribedId).on("postgres_changes",{event:"INSERT",schema:"public",table:"live_chat_messages",filter:"match_id=eq."+subscribedId},()=>{if(chatMatchId===subscribedId)loadChat();}).subscribe();}
async function chatDisplayName(){
 const {data:links}=await sb.from("player_accounts").select("player_id").eq("user_id",currentUser.id).eq("active",true).limit(1);
 if(links?.length){
   const {data:player}=await sb.from("players").select("name").eq("id",links[0].player_id).maybeSingle();
   if(player?.name)return player.name;
 }
 const {data:profile}=await sb.from("profiles").select("display_name,full_name,name").eq("id",currentUser.id).maybeSingle();
 return profile?.display_name||profile?.full_name||profile?.name||currentUser.user_metadata?.display_name||currentUser.email?.split("@")[0]||"Nutzer";
}
async function sendChat(e){
 e.preventDefault();if(!currentUser||!chatMatchId)return;
 const targetMatchId=chatMatchId;
 const {data:match}=await sb.from("matches").select("status").eq("id",targetMatchId).maybeSingle();
 if(!match||!["live","finished"].includes(String(match.status||"").toLowerCase())){document.getElementById("chatStatus").textContent="Dieser Chat ist nicht mehr verfügbar.";return;}
 const input=document.getElementById("chatInput"),message=input.value.trim();if(!message)return;
 const display_name=await chatDisplayName();
 const {error}=await sb.from("live_chat_messages").insert({match_id:targetMatchId,user_id:currentUser.id,display_name,message});
 if(error){document.getElementById("chatStatus").textContent="Nachricht konnte nicht gesendet werden. Chat-Berechtigungen prüfen.";return;}
 input.value="";await loadChat();
}
async function initIdentity(){
 const {data:{session}}=await sb.auth.getSession();currentUser=session?.user||null;
 if(currentUser){const {data:profile}=await sb.from("profiles").select("role").eq("id",currentUser.id).maybeSingle();isAdmin=profile?.role==="admin";ensureChatUi();}
 sb.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;isAdmin=false;if(currentUser){const {data:profile}=await sb.from("profiles").select("role").eq("id",currentUser.id).maybeSingle();isAdmin=profile?.role==="admin";ensureChatUi();}else{document.getElementById("chatModal")?.remove();chatMatchId=null;if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null;}isAdmin=false;showFinished=false;}await load();});
}
(async()=>{await initIdentity();await load();if(currentId)subscribe()})();
</script>

<script>

(function(){
 const root=document.getElementById('platformNav'); if(!root) return;
 const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
 const items=[
  {label:'Dashboard',href:'index.html',roles:['player','team_manager','moderator','scorer','admin','board','advisory']},
  {label:'Vereine',href:'vereine.html',roles:['player','team_manager','moderator','scorer','admin','board','advisory']},
  {label:'Mannschaften',href:'mannschaft.html',roles:['team_manager','moderator','admin','board','advisory']},
  {label:'Spielplan',href:'spielplan.html',roles:['player','team_manager','moderator','scorer','admin','board','advisory']},
  {label:'Aufstellung',href:'aufstellung.html',roles:['team_manager','moderator','admin']},
  {label:'Live',href:'live.html',roles:['player','team_manager','moderator','scorer','admin','board','advisory']},
  {label:'Moderator',href:'moderator.html',roles:['moderator','scorer','admin']},
  {label:'Spielbericht',href:'spielbericht.html',roles:['moderator','admin']},
  {label:'Spielerstatistik',href:'spielerstatistik.html',roles:['player','team_manager','moderator','admin','board','advisory']},
  {label:'Rangliste',href:'Rangliste.html',roles:['player','team_manager','moderator','admin','board','advisory']},
  {label:'Administration',href:'admin.html',roles:['admin']}
 ];
 const primary=['Dashboard','Vereine','Mannschaften','Spielplan','Aufstellung','Live'];
 const labels=new Set(primary);
 function link(it){const a=document.createElement('a');a.href=it.href;a.textContent=it.label;if(current===it.href.toLowerCase())a.setAttribute('aria-current','page');return a}
 const links=root.querySelector('.pn-links'); if(!links)return;
 function render(role,loggedIn){
   links.innerHTML='';
   const allowed=items.filter(it=>it.roles.includes(role));
   allowed.filter(it=>labels.has(it.label)).forEach(it=>links.appendChild(link(it)));
   const more=allowed.filter(it=>!labels.has(it.label));
   if(more.length){
     const d=document.createElement('details');d.className='pn-more';
     const s=document.createElement('summary');s.textContent='Mehr ▾';d.appendChild(s);
     const menu=document.createElement('div');menu.className='pn-menu';more.forEach(it=>menu.appendChild(link(it)));d.appendChild(menu);links.appendChild(d);
   }
   const u=root.querySelector('.pn-user'); if(u)u.textContent=loggedIn?'Angemeldet':'Öffentlicher Bereich';
 }
 const toggle=root.querySelector('.pn-toggle');
 if(toggle)toggle.addEventListener('click',()=>{const open=links.classList.toggle('pn-open');toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'✕ Schließen':'☰ Menü';});
 // Keep public access functional; logged-in roles receive a tailored menu.
 const fallback=()=>render('player',false);
 if(!window.supabase||!window.supabase.createClient){fallback();return}
 const url='https://apsarswjmsrmffoyxsgr.supabase.co';
 const key='sb_publishable_yN9CDCZEHrCkCVMb87SkRg_hQjPjNmj';
 try{
   const client=window.__platformNavClient||(window.__platformNavClient=window.supabase.createClient(url,key));
   client.auth.getUser().then(async ({data,error})=>{
     if(error||!data.user){fallback();return}
     let role='player';
     const {data:profile}=await client.from('profiles').select('role').eq('id',data.user.id).maybeSingle();
     if(profile&&profile.role)role=String(profile.role).toLowerCase();
     const {data:members}=await client.from('club_memberships').select('club_role,status').eq('user_id',data.user.id).eq('status','active');
     const roles=(members||[]).map(x=>String(x.club_role||'').toLowerCase());
     if(role!=='admin'&&roles.length){
       if(roles.includes('team_manager'))role='team_manager';
       else if(roles.includes('moderator'))role='moderator';
       else if(roles.includes('board'))role='board';
       else if(roles.includes('advisory'))role='advisory';
     }
     render(role,true);
   }).catch(fallback);
 }catch(e){fallback()}
})();

</script>

<script id="live-profile-menu">
(() => {
  "use strict";
  const button = document.getElementById("profileBtn");
  const menu = document.getElementById("profileMenu");
  const login = document.getElementById("profileLogin");
  const manage = document.getElementById("profileManage");
  const logout = document.getElementById("logoutBtn");
  if (!button || !menu) return;

  const close = () => {
    menu.hidden = true;
    button.setAttribute("aria-expanded", "false");
  };
  const open = () => {
    menu.hidden = false;
    button.setAttribute("aria-expanded", "true");
  };

  button.addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    menu.hidden ? open() : close();
  });

  document.addEventListener("click", event => {
    if (!menu.contains(event.target) && !button.contains(event.target)) close();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      close();
      button.focus();
    }
  });

  const setSignedIn = signedIn => {
    if (login) login.hidden = !!signedIn;
    if (manage) manage.hidden = !signedIn;
    if (logout) logout.hidden = !signedIn;
    button.setAttribute("aria-label", signedIn ? "Profil und Kontoeinstellungen" : "Anmelden / Profil");
  };

  const refreshSession = async () => {
    try {
      const { data, error } = await sb.auth.getSession();
      if (error) throw error;
      setSignedIn(!!data?.session);
    } catch (error) {
      console.warn("[BadminOne Profilmenü] Sitzung konnte nicht gelesen werden:", error);
      setSignedIn(false);
    }
  };

  logout?.addEventListener("click", async () => {
    logout.disabled = true;
    try {
      const { error } = await sb.auth.signOut();
      if (error) throw error;
      close();
      setSignedIn(false);
      await load();
    } catch (error) {
      alert("Abmelden war nicht möglich: " + (error?.message || "Unbekannter Fehler"));
    } finally {
      logout.disabled = false;
    }
  });

  sb.auth.onAuthStateChange((_event, session) => setSignedIn(!!session));
  refreshSession();
})();
</script>

</body>
</html>
