<script>
const SUPABASE_URL = "https://apsarswjmsrmffoyxsgr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yN9CDCZEHrCkCVMb87SkRg_hQjPjNmj";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const $ = id => document.getElementById(id);
const ORDER = ["HD1","HD2","DD","HE1","HE2","HE3","DE","GD"];
const LABELS = {
  HD1:"1. Herrendoppel", HD2:"2. Herrendoppel", DD:"Damendoppel",
  HE1:"1. Herreneinzel", HE2:"2. Herreneinzel", HE3:"3. Herreneinzel",
  DE:"Dameneinzel", GD:"Gemischtes Doppel"
};

let currentUser = null;
let currentProfile = null;
let matches = [];
let selectedMatch = null;
let selectedGames = [];
let allMatches = [];
let authorizedClubs = [];
let authorizedTeams = [];
let isAdmin = false;

function showStatus(el,text,type=""){
  el.textContent = text;
  el.className = "status " + type;
}
function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function formatDate(v){
  if(!v)return "";
  try{return new Date(v+"T00:00:00").toLocaleDateString("de-DE");}
  catch(e){return v;}
}
function errorText(e){return e?.message||e?.details||"Unbekannter Fehler";}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function loadProfile(user){
  const {data,error}=await sb.from("profiles")
    .select("id,display_name,role,team_name")
    .eq("id",user.id).single();
  if(error)throw new Error("Profil konnte nicht geladen werden: "+error.message);
  return data;
}

function fillSelect(select,items,placeholder,labelKey="name"){
  const current=select.value;
  select.innerHTML=`<option value="">${escapeHtml(placeholder)}</option>`+
    items.map(item=>`<option value="${escapeHtml(item.id)}">${escapeHtml(item[labelKey]||"")}</option>`).join("");
  if(items.some(item=>String(item.id)===current))select.value=current;
}

function updateTeamOptions(){
  const clubId=$("clubFilter").value;
  const available=authorizedTeams.filter(team=>!clubId||team.club_id===clubId);
  fillSelect($("teamFilter"),available,"Alle berechtigten Mannschaften");
  renderMatches();
}

function visibleMatches(){
  const clubId=$("clubFilter").value;
  const teamId=$("teamFilter").value;
  const status=$("statusFilter").value||"all";
  let allowedIds=new Set(authorizedTeams.filter(team=>!clubId||team.club_id===clubId).map(team=>team.id));
  if(teamId)allowedIds=new Set([teamId]);
  return allMatches.filter(match=>{
    if(!isAdmin && !allowedIds.has(match.managed_by_team_id))return false;
    if(status==="open" && !["planned","scheduled","open"].includes(String(match.status||"").toLowerCase()))return false;
    if(status==="live" && String(match.status||"").toLowerCase()!=="live")return false;
    if(status==="finished" && String(match.status||"").toLowerCase()!=="finished")return false;
    return true;
  }).sort((a,b)=>{
    const ad=`${a.match_date||"9999-12-31"}T${String(a.match_time||"23:59:59")}`;
    const bd=`${b.match_date||"9999-12-31"}T${String(b.match_time||"23:59:59")}`;
    return ad.localeCompare(bd);
  });
}

function renderMatches(){
  const box=$("matches"), shown=visibleMatches();
  matches=shown;
  if(!shown.length){
    box.innerHTML='<div class="empty">Für diese Auswahl wurden keine berechtigten Begegnungen gefunden.</div>';
    return;
  }
  box.innerHTML=shown.map(m=>{
    const active=selectedMatch?.id===m.id ? " selected":"";
    return `<div class="match${active}" onclick="selectMatch('${escapeHtml(m.id)}')">
      <div class="match-title">${escapeHtml(m.home_team||"Heim")} – ${escapeHtml(m.away_team||"Gast")}</div>
      <div class="match-meta">
        ${m.match_date?escapeHtml(formatDate(m.match_date)):""}
        ${m.match_time?" · "+escapeHtml(String(m.match_time).slice(0,5))+" Uhr":""}
        · Status: ${escapeHtml(statusLabel(m.status))}
      </div>
    </div>`;
  }).join("");
}

async function loadMatches(){
  const box=$("matches");
  box.innerHTML='<div class="empty">Lade berechtigte Begegnungen …</div>';
  const {data,error}=await sb.from("matches")
    .select("id,home_team,away_team,home_team_id,away_team_id,managed_by_team_id,match_date,match_time,status")
    .order("match_date",{ascending:true})
    .order("match_time",{ascending:true})
    .limit(300);
  if(error){
    showStatus($("appStatus"),"Begegnungen konnten nicht geladen werden: "+errorText(error),"bad");
    box.innerHTML="";
    return;
  }
  allMatches=data||[];
  if(!allMatches.length){renderMatches();return;}
  const matchIds=allMatches.map(match=>match.id);
  const {data:gameRows,error:gamesError}=await sb.from("match_games")
    .select("match_id,player1,player2,opponent_player1,opponent_player2,home_player1_id,home_player2_id,away_player1_id,away_player2_id")
    .in("match_id",matchIds);
  if(gamesError){
    showStatus($("appStatus"),"Aufstellungen konnten nicht geprüft werden: "+errorText(gamesError),"bad");
    allMatches=[];renderMatches();return;
  }
  const gamesByMatch=new Map();
  (gameRows||[]).forEach(game=>{
    if(!gamesByMatch.has(game.match_id))gamesByMatch.set(game.match_id,[]);
    gamesByMatch.get(game.match_id).push(game);
  });
  allMatches=allMatches.filter(match=>{
    const ownSide=match.managed_by_team_id===match.home_team_id?"home":
                  match.managed_by_team_id===match.away_team_id?"away":null;
    if(!ownSide)return false;
    return (gamesByMatch.get(match.id)||[]).some(game=>{
      const names=ownSide==="home"?[game.player1,game.player2]:[game.opponent_player1,game.opponent_player2];
      const ids=ownSide==="home"?[game.home_player1_id,game.home_player2_id]:[game.away_player1_id,game.away_player2_id];
      return names.some(name=>String(name||"").trim()!=="")||ids.some(id=>id!==null&&id!==undefined);
    });
  });
  renderMatches();
}
function statusLabel(s){
  return s==="live" ? "LIVE" : s==="finished" ? "beendet" : "geplant";
}

function playerText(g){
  const home=g.player2 ? `${g.player1||"–"} / ${g.player2||"–"}` : (g.player1||"–");
  const away=g.opponent_player2 ? `${g.opponent_player1||"–"} / ${g.opponent_player2||"–"}` : (g.opponent_player1||"–");
  return `<div><b>Heim:</b> ${escapeHtml(home)}</div><div><b>Gast:</b> ${escapeHtml(away)}</div>`;
}

function isNoPlayer(name){
  return String(name||"").trim()==="Kein Spieler";
}

function sideHasNoPlayer(g,side){
  if(side==="home"){
    if(g.position==="HD1"||g.position==="HD2"||g.position==="DD"||g.position==="GD")
      return isNoPlayer(g.player1)&&isNoPlayer(g.player2);
    return isNoPlayer(g.player1);
  }
  if(g.position==="HD1"||g.position==="HD2"||g.position==="DD"||g.position==="GD")
    return isNoPlayer(g.opponent_player1)&&isNoPlayer(g.opponent_player2);
  return isNoPlayer(g.opponent_player1);
}

function gameDisposition(g){
  const homeNo=sideHasNoPlayer(g,"home");
  const awayNo=sideHasNoPlayer(g,"away");
  if(homeNo&&awayNo)return "excluded";
  if(homeNo)return "forfeit_home";
  if(awayNo)return "forfeit_away";
  return "normal";
}

function forfeitWinner(g){
  const d=gameDisposition(g);
  return d==="forfeit_home"?"away":d==="forfeit_away"?"home":null;
}

function gameWinner(g){
  const disposition=gameDisposition(g);
  if(disposition==="excluded")return null;
  const forced=forfeitWinner(g);
  if(forced && g.status==="finished")return forced;
  let home=0,away=0;
  for(let n=1;n<=3;n++){
    // Ein laufender Satz (z.B. 1:0) darf noch KEINEN Spielgewinner
    // erzeugen. Nur regelkonform abgeschlossene Sätze zählen.
    if(!isSetCompleted(g,n))continue;
    const h=g[`set${n}_home`], a=g[`set${n}_away`];
    if(h==null || a==null)continue;
    if(Number(h)>Number(a))home++;
    else if(Number(a)>Number(h))away++;
  }
  return home>=2 ? "home" : away>=2 ? "away" : null;
}

function gameSetWins(g){
  let home=0,away=0;
  for(let n=1;n<=3;n++){
    const h=g[`set${n}_home`], a=g[`set${n}_away`];
    if(h==null || a==null)continue;
    if(Number(h)>Number(a))home++;
    else if(Number(a)>Number(h))away++;
  }
  return {home,away};
}

function gameIsTouched(g){
  for(let n=1;n<=3;n++){
    if(g[`set${n}_home`]!=null || g[`set${n}_away`]!=null)return true;
  }
  return false;
}

function matchScore(games){
  let home=0,away=0;
  games.forEach(g=>{
    const w=gameWinner(g);
    if(w==="home")home++;
    if(w==="away")away++;
  });
  return {home,away};
}

function finishedCount(games){
  return games.filter(g=>!!gameWinner(g)||gameDisposition(g)==="excluded").length;
}

async function getGames(matchId){
  const {data,error}=await sb.from("match_games")
    .select("*").eq("match_id",matchId);
  if(error)throw new Error("Spiele konnten nicht geladen werden: "+errorText(error));
  return (data||[]).sort((a,b)=>ORDER.indexOf(a.position)-ORDER.indexOf(b.position));
}

async function selectMatch(id){
  selectedMatch=allMatches.find(m=>m.id===id)||null;
  if(!selectedMatch)return;

  await loadMatches();
  $("editorCard").classList.remove("hidden");
  $("games").innerHTML='<div class="small">Lade Aufstellung und Spiele …</div>';

  try{
    selectedGames=await getGames(id);
    renderEditor();
    $("editorCard").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    showStatus($("editorStatus"),errorText(e),"bad");
  }
}

function renderEditor(){
  if(!selectedMatch)return;

  const score=matchScore(selectedGames);
  const done=finishedCount(selectedGames);
  const pct=Math.round(done/8*100);

  $("matchHeader").innerHTML=`
    <div class="match-head">
      <div class="match-head-title">${escapeHtml(selectedMatch.home_team||"Heim")} – ${escapeHtml(selectedMatch.away_team||"Gast")}</div>
      <div class="match-meta">
        ${selectedMatch.match_date?escapeHtml(formatDate(selectedMatch.match_date)):""}
        ${selectedMatch.match_time?" · "+escapeHtml(String(selectedMatch.match_time).slice(0,5))+" Uhr":""}
        · ${escapeHtml(statusLabel(selectedMatch.status))}
      </div>
      <div class="match-score">
        <div class="team">${escapeHtml(selectedMatch.home_team||"Heim")}</div>
        <strong>${score.home} : ${score.away}</strong>
        <div class="team">${escapeHtml(selectedMatch.away_team||"Gast")}</div>
      </div>
      <div class="progress"><div class="progress-fill" data-progress="${pct}"></div></div>
      <div class="small progress-caption">${done} von 8 Spielen erledigt${selectedGames.filter(g=>gameDisposition(g)==="excluded").length?` · ${selectedGames.filter(g=>gameDisposition(g)==="excluded").length} Spiel(e) entfallen`:""}</div>
      <div class="toolbar">
        <button class="secondary" onclick="setMatchStatus('live')">🔴 Begegnung LIVE</button>
        <button class="secondary" onclick="setMatchStatus('finished')">✅ Begegnung beenden</button>
      </div>
    </div>`;
  const progressFill=$("matchHeader").querySelector(".progress-fill");
  if(progressFill)progressFill.style.width=`${pct}%`;

  if(!selectedGames.length){
    $("games").innerHTML='<div class="status bad">Für dieses Match wurden keine Spiele gefunden.</div>';
    return;
  }

  $("games").innerHTML=selectedGames.map(g=>renderGame(g)).join("");
  $("editorStatus").classList.add("hidden");
}

function isValidCompletedSetScore(h,a){
  h=h==null?null:Number(h); a=a==null?null:Number(a);
  if(h==null || a==null || !Number.isInteger(h) || !Number.isInteger(a) || h<0 || a<0 || h>30 || a>30)return false;
  const high=Math.max(h,a), low=Math.min(h,a);
  return (high===21 && low<=19) ||
    (high>=22 && high<=29 && high-low===2) ||
    (high===30 && (low===28 || low===29));
}

function isSetCompleted(g,n){
  if(g._unlockedSet===n)return false;
  return isValidCompletedSetScore(g[`set${n}_home`],g[`set${n}_away`]);
}

function isSetEnabled(g,n){
  if(g._unlockedSet===n)return true;
  if(g._unlockedSet && n>g._unlockedSet)return false;
  if(n===1)return true;
  if(n===2)return isSetCompleted(g,1) && !gameWinnerAfterSet(g,1);
  if(n===3)return isSetCompleted(g,2) && !gameWinnerAfterSet(g,2) && !gameWinner(g);
  return false;
}

function gameWinnerAfterSet(g,n){
  let home=0,away=0;
  for(let i=1;i<=n;i++){
    // Nur tatsächlich beendete Sätze zählen. Ein Zwischenstand wie 1:0
    // darf weder einen Satz- noch einen Spielgewinner erzeugen.
    if(!isSetCompleted(g,i))continue;
    const h=g[`set${i}_home`], a=g[`set${i}_away`];
    if(h==null || a==null)continue;
    if(Number(h)>Number(a))home++;
    else if(Number(a)>Number(h))away++;
  }
  return home>=2 ? "home" : away>=2 ? "away" : null;
}

function renderGame(g){
  const disposition=gameDisposition(g);
  const wins=gameSetWins(g);
  const winner=gameWinner(g);

  if(disposition==="excluded"){
    return `<div class="game excluded" id="game_${escapeHtml(g.id)}">
      <div class="game-head">
        <div>
          <div class="game-title">${escapeHtml(LABELS[g.position]||g.position)}</div>
          <div class="players">${playerText(g)}</div>
        </div>
        <div class="game-result">–</div>
      </div>
      <div class="special-game excluded">
        <strong>⚪ Spiel entfällt aus der Wertung</strong>
        Beide Mannschaften stellen für dieses Spiel keinen Spieler. Es wird weder als Sieg noch als Niederlage gewertet.
      </div>
    </div>`;
  }

  if(disposition==="forfeit_home"||disposition==="forfeit_away"){
    const forcedWinner=forfeitWinner(g);
    const winnerName=forcedWinner==="home"?(selectedMatch.home_team||"Heim"):(selectedMatch.away_team||"Gast");
    const alreadyDone=!!winner;
    return `<div class="game ${alreadyDone?"finished":"forfeit"}" id="game_${escapeHtml(g.id)}">
      <div class="game-head">
        <div>
          <div class="game-title">${escapeHtml(LABELS[g.position]||g.position)}</div>
          <div class="players">${playerText(g)}</div>
        </div>
        <div class="game-result">${alreadyDone?`${wins.home} : ${wins.away}`:"–"}</div>
      </div>
      <div class="special-game forfeit">
        <strong>${alreadyDone?`⚠️ kampflos · ${escapeHtml(winnerName)} gewinnt`:`⚠️ kampflos · ${escapeHtml(winnerName)} würde gewinnen`}</strong>
        ${alreadyDone
          ? `Das Spiel wurde mit 21:0 / 21:0 für ${escapeHtml(winnerName)} gewertet.`
          : `Eine Mannschaft stellt keine Spieler. Das Spiel kann kampflos mit 21:0 / 21:0 gewertet werden.`}
      </div>
      ${alreadyDone
        ? `<div class="set-action set-action-spaced"><button class="secondary" onclick="clearGame('${escapeHtml(g.id)}')">↩ Kampflos-Wertung zurücksetzen</button></div>`
        : `<div class="set-action set-action-spaced"><button class="primary" onclick="finishForfeit('${escapeHtml(g.id)}')">Kampflos mit 21:0 / 21:0 werten</button></div>`}
    </div>`;
  }

  const stateClass=winner?"finished":gameIsTouched(g)?"live":"";
  const stateText=winner
    ? (winner==="home" ? "✅ Heim gewinnt das Spiel":"✅ Gast gewinnt das Spiel")
    : gameIsTouched(g) ? "🔴 läuft" : "⏳ offen";

  return `<div class="game ${stateClass}" id="game_${escapeHtml(g.id)}">
    <div class="game-head">
      <div>
        <div class="game-title">${escapeHtml(LABELS[g.position]||g.position)}</div>
        <div class="players">${playerText(g)}</div>
      </div>
      <div class="game-result">${wins.home} : ${wins.away}</div>
    </div>
    <div class="game-state">${stateText}</div>
    ${[1,2,3].map(n=>renderSetRow(g,n)).join("")}
  </div>`;
}

async function finishForfeit(gameId){
  const g=selectedGames.find(x=>x.id===gameId);
  if(!g)return;
  const disposition=gameDisposition(g);
  const winner=forfeitWinner(g);
  if(!winner || disposition==="excluded")return;
  const winnerName=winner==="home"?(selectedMatch.home_team||"Heim"):(selectedMatch.away_team||"Gast");
  if(!confirm(`Kampfloses Spiel für ${winnerName} werten?\n\nEs werden zwei Sätze mit 21:0 / 21:0 eingetragen.`))return;

  const values=winner==="home"
    ? {set1_home:21,set1_away:0,set2_home:21,set2_away:0,set3_home:null,set3_away:null,winner:"home",status:"finished"}
    : {set1_home:0,set1_away:21,set2_home:0,set2_away:21,set3_home:null,set3_away:null,winner:"away",status:"finished"};

  const {error}=await sb.from("match_games").update(values).eq("id",gameId);
  if(error){showStatus($("editorStatus"),`Kampfloses Spiel konnte nicht gespeichert werden: ${errorText(error)}`,"bad");return;}

  selectedGames=await getGames(selectedMatch.id);
  await updateOverallMatchStatus();
  selectedGames=await getGames(selectedMatch.id);
  renderEditor();
  showStatus($("editorStatus"),`Kampfloses Spiel gespeichert: ${winnerName} gewinnt mit 21:0 / 21:0.`,"ok");
  await loadMatches();
}

function canIncreaseScore(h,a,side){
  h=Number(h)||0; a=Number(a)||0;

  const nextH=side==="home" ? h+1 : h;
  const nextA=side==="away" ? a+1 : a;

  if(nextH>30 || nextA>30)return false;

  const currentHigh=Math.max(h,a);
  const currentLow=Math.min(h,a);
  const currentWinner =
    (currentHigh===21 && currentLow<=19) ||
    (currentHigh>=22 && currentHigh<=29 && currentHigh-currentLow===2) ||
    (currentHigh===30 && currentLow>=28);

  // Nach einem bereits möglichen Gewinn bleiben Korrekturen möglich:
  // Der bisher unterlegene Punktestand darf noch erhöht werden, damit
  // ein versehentlich zu früh eingetragener Spielstand korrigiert werden
  // kann. Der Sieger darf dagegen nicht direkt z.B. 21:19 -> 22:19 zählen.
  if(currentWinner){
    const currentWinnerSide = h>a ? "home" : "away";
    if(side===currentWinnerSide)return false;
    // Ausnahme für Korrektur: der andere Wert darf noch bis 20 steigen.
    return nextH<=21 && nextA<=21;
  }

  const nextHigh=Math.max(nextH,nextA);
  const nextLow=Math.min(nextH,nextA);

  // Bis einschließlich 21 Punkte ist die laufende Eingabe möglich.
  if(nextHigh<=21)return true;

  // Ab 22 Punkten sind nur Verlängerungen ab 20:20 zulässig.
  if(nextHigh>=22 && nextHigh<=29)return nextLow>=20;

  // 30 Punkte nur als 30:28 oder 30:29.
  if(nextHigh===30)return nextLow>=28;

  return false;
}

function renderSetRow(g,n){
  const h=g[`set${n}_home`];
  const a=g[`set${n}_away`];
  const hv=h==null?"":Number(h);
  const av=a==null?"":Number(a);
  const completed=isSetCompleted(g,n);
  const matchWinner=gameWinner(g);
  const enabled=isSetEnabled(g,n);
  // Sätze werden der Reihe nach freigeschaltet: Satz 2 erst nach Satz 1,
  // Satz 3 erst nach Satz 2 und nur solange das Spiel nicht entschieden ist.
  const disabled=completed||!!matchWinner||!enabled;

  let setState="📝 Ergebnis direkt eintragen";
  if(completed){
    const sh=Number(h)>Number(a)?"Heim":"Gast";
    setState=`✅ gespeichert · ${sh}`;
  }else if(matchWinner){
    setState=`🔒 Spiel bereits entschieden · ${matchWinner==="home"?(selectedMatch.home_team||"Heim"):(selectedMatch.away_team||"Gast")} gewinnt`;
  }else if(!enabled){
    setState=`🔒 erst nach Satz ${n-1}`;
  }

  return `<div class="set-row ${disabled?"set-disabled":""}">
    <div class="set-label">
      <div>Satz ${n}</div>
      <div class="small">${setState}</div>
    </div>

    <div class="score-box direct-score-box">
      <div class="score-team">${escapeHtml(selectedMatch.home_team||"Heim")}</div>
      <input class="direct-score-input" type="number" inputmode="numeric" min="0" max="30" step="1"
        id="num_${g.id}_${n}_h" aria-label="Punkte ${escapeHtml(selectedMatch.home_team||"Heim")} Satz ${n}"
        value="${hv}" placeholder="0" ${disabled?"disabled":""}>
      <div class="stepper direct-score-stepper">
        <button class="minus" ${disabled?"disabled":""} onclick="changePoint('${escapeHtml(g.id)}',${n},'home',-1)">−</button>
        <button class="plus" ${disabled?"disabled":""} onclick="changePoint('${escapeHtml(g.id)}',${n},'home',1)">+</button>
      </div>
    </div>

    <div class="score-box direct-score-box">
      <div class="score-team">${escapeHtml(selectedMatch.away_team||"Gast")}</div>
      <input class="direct-score-input" type="number" inputmode="numeric" min="0" max="30" step="1"
        id="num_${g.id}_${n}_a" aria-label="Punkte ${escapeHtml(selectedMatch.away_team||"Gast")} Satz ${n}"
        value="${av}" placeholder="0" ${disabled?"disabled":""}>
      <div class="stepper direct-score-stepper">
        <button class="minus" ${disabled?"disabled":""} onclick="changePoint('${escapeHtml(g.id)}',${n},'away',-1)">−</button>
        <button class="plus" ${disabled?"disabled":""} onclick="changePoint('${escapeHtml(g.id)}',${n},'away',1)">+</button>
      </div>
    </div>

    <div class="set-action">
      ${completed
        ? `<button class="secondary" onclick="unlockSet('${escapeHtml(g.id)}',${n})">↩ Ergebnis korrigieren</button>`
        : `<button class="primary" onclick="finishSet('${escapeHtml(g.id)}',${n})">Satz ${n} speichern</button>`
      }
    </div>
  </div>`;
}

async function unlockSet(gameId,n){
  let g=selectedGames.find(x=>x.id===gameId);
  if(!g || !isSetCompleted(g,n))return;

  if(!confirm(`Satz ${n} wieder freischalten?\n\nDie Punkte bleiben zunächst erhalten und können danach korrigiert werden.`))return;

  // Beim Zurücknehmen eines Satzabschlusses wird der Spielstatus zurückgesetzt.
  // Die Punkte bleiben erhalten. Frühere Sätze bleiben abgeschlossen.
  const {error}=await sb.from("match_games").update({
    winner:null,
    status:"live"
  }).eq("id",gameId);

  if(error){
    showStatus($("editorStatus"),`Satz ${n} konnte nicht freigeschaltet werden: ${errorText(error)}`,"bad");
    return;
  }

  // Die Begegnung ist durch die Korrektur wieder in Bearbeitung.
  const {error:matchError}=await sb.rpc("set_match_status",{p_match_id:selectedMatch.id,p_status:"live"});

  if(matchError){
    showStatus($("editorStatus"),`Satz ${n} wurde freigeschaltet, aber der Begegnungsstatus konnte nicht aktualisiert werden: ${errorText(matchError)}`,"warn");
  }else{
    selectedMatch.status="live";
  }

  selectedGames=await getGames(selectedMatch.id);

  // Nur der ausgewählte Satz darf wieder bearbeitet werden.
  // Dafür markieren wir ihn lokal als offen; die Datenbankwerte bleiben bestehen.
  g = selectedGames.find(x=>x.id===gameId);
  if(g){
    g._unlockedSet=n;
  }

  renderEditor();
  showStatus(
    $("editorStatus"),
    `Satz ${n} ist wieder freigeschaltet. Die vorhandenen Punkte bleiben erhalten und können mit +/− korrigiert werden.`,
    "ok"
  );
}

async function changePoint(gameId,n,side,delta){
  const g=selectedGames.find(x=>x.id===gameId);
  if(!g || gameDisposition(g)!=="normal" || gameWinner(g) || !isSetEnabled(g,n))return;

  const key=`set${n}_${side}`;
  const num=$(`num_${gameId}_${n}_${side==="home"?"h":"a"}`);
  const other=$(`num_${gameId}_${n}_${side==="home"?"a":"h"}`);
  const current=num&&num.value!==""?Number(num.value):(g[key]==null?0:Number(g[key]));
  // Badminton: maximal 30 Punkte pro Satz.
  const value=Math.max(0,Math.min(30,current+delta));
  g[key]=value;
  if(num)num.value=String(value);

  // Punktestand aus Eingabefeldern lesen und +/−-Buttons regelkonform begrenzen.
  const homeValue=Number($(`num_${gameId}_${n}_h`)?.value||0);
  const awayValue=Number($(`num_${gameId}_${n}_a`)?.value||0);
  const row=num?.closest(".set-row");
  if(row){
    const homeButtons=row.querySelectorAll(".score-box")[0]?.querySelectorAll("button.plus");
    const awayButtons=row.querySelectorAll(".score-box")[1]?.querySelectorAll("button.plus");
    if(homeButtons?.[0])homeButtons[0].disabled=!canIncreaseScore(homeValue,awayValue,"home");
    if(awayButtons?.[0])awayButtons[0].disabled=!canIncreaseScore(homeValue,awayValue,"away");
  }

  // WICHTIG: Jeder Punkt wird sofort in Supabase gespeichert.
  // Auch der jeweils noch nicht angeklickte Gegnerwert wird als 0 gespeichert.
  // Sonst bleibt dieser Wert in der Datenbank NULL und der öffentliche
  // Liveticker kann den Zwischenstand (z.B. 1:0) nicht als Satzstand anzeigen.
  const homeKey=`set${n}_home`;
  const awayKey=`set${n}_away`;
  const persistedHomeValue=g[homeKey]==null ? 0 : Number(g[homeKey]);
  const persistedAwayValue=g[awayKey]==null ? 0 : Number(g[awayKey]);
  g[homeKey]=persistedHomeValue;
  g[awayKey]=persistedAwayValue;

  const {error}=await sb.from("match_games").update({
    [homeKey]:persistedHomeValue,
    [awayKey]:persistedAwayValue,
    winner:null,
    status:"live"
  }).eq("id",gameId);

  if(error){
    // Bei einem Speicherfehler den lokalen Wert wieder aus der Datenbank laden.
    selectedGames=await getGames(selectedMatch.id);
    renderEditor();
    showStatus($("editorStatus"),`Punkt konnte nicht gespeichert werden: ${errorText(error)}`,"bad");
    return;
  }

  // Auch der Begegnungsstatus wird beim ersten Punkt auf LIVE gesetzt.
  if(selectedMatch.status!=="live"){
    const {error:matchError}=await sb.rpc("set_match_status",{p_match_id:selectedMatch.id,p_status:"live"});
    if(!matchError)selectedMatch.status="live";
  }
}

async function finishSet(gameId,n){
  const g=selectedGames.find(x=>x.id===gameId);
  if(!g || gameDisposition(g)!=="normal")return;
  if(!isSetEnabled(g,n)){
    showStatus($("editorStatus"),`Satz ${n} ist noch gesperrt. Bitte zuerst Satz ${n-1} vollständig speichern.`,"warn");
    renderEditor();
    return;
  }
  if(gameWinner(g)){
    showStatus($("editorStatus"),"Das Spiel ist bereits entschieden. Ein weiterer Satz kann nicht gespeichert werden.","warn");
    renderEditor();
    return;
  }
  // Die UI kann nach einer Live-Punktänderung kurz einen alten Enable-Status
  // haben. Ein regelkonformer aktueller Punktestand darf deshalb trotzdem
  // ausdrücklich mit „Satz beenden“ abgeschlossen werden.
  // Direkte Satzeingabe: Werte aus den Eingabefeldern lesen.
  // Jeder Satz kann unabhängig von den anderen Sätzen erfasst werden.
  const homeInput=$(`num_${gameId}_${n}_h`);
  const awayInput=$(`num_${gameId}_${n}_a`);
  const rawH=homeInput?homeInput.value:g[`set${n}_home`];
  const rawA=awayInput?awayInput.value:g[`set${n}_away`];
  if(rawH===""||rawA===""){
    showStatus($("editorStatus"),`Bitte für Satz ${n} beide Punktzahlen eintragen.`,"warn");
    return;
  }
  const h=Number(rawH);
  const a=Number(rawA);

  if(!Number.isInteger(h) || !Number.isInteger(a) || h<0 || a<0 || h>30 || a>30){
    showStatus($("editorStatus"),`Satz ${n} hat einen ungültigen Punktestand. Ein Satz kann maximal bis 30 Punkte gehen.`,"warn");
    return;
  }

  const high=Math.max(h,a);
  const low=Math.min(h,a);
  const validSet = isValidCompletedSetScore(h,a);

  if(!validSet){
    showStatus(
      $("editorStatus"),
      `Satz ${n} ist so nicht regelkonform. Gewinn ist ab 21 Punkten mit 2 Punkten Vorsprung, bei 29:29 mit dem 30. Punkt.`,
      "warn"
    );
    return;
  }

  const projected={...g};
  projected[`set${n}_home`]=Number(h);
  projected[`set${n}_away`]=Number(a);

  const winner=gameWinner(projected);
  const status=winner ? "finished" : "live";

  const {error}=await sb.from("match_games").update({
    [`set${n}_home`]:Number(h),
    [`set${n}_away`]:Number(a),
    winner,
    status
  }).eq("id",gameId);

  if(error){
    showStatus($("editorStatus"),`Satz ${n} konnte nicht gespeichert werden: ${errorText(error)}`,"bad");
    return;
  }

  selectedGames=await getGames(selectedMatch.id);
  const refreshed=selectedGames.find(x=>x.id===gameId);
  if(refreshed)delete refreshed._unlockedSet;
  await updateOverallMatchStatus();
  selectedGames=await getGames(selectedMatch.id);
  renderEditor();

  showStatus(
    $("editorStatus"),
    winner
      ? `Satz ${n} beendet und gespeichert. ${winner==="home"?"Heim":"Gast"} gewinnt das Spiel.`
      : `Satz ${n} beendet und gespeichert. Jetzt ist der nächste Satz freigeschaltet.`,
    "ok"
  );
  await loadMatches();
}

async function saveGame(id){
  showStatus($("editorStatus"),"Bitte jeden Satz einzeln mit „Satz beenden“ abschließen.","warn");
}

async function clearGame(id){
  const g=selectedGames.find(x=>x.id===id);
  if(!g)return;
  if(!confirm(`Ergebnis von ${LABELS[g.position]||g.position} wirklich löschen?`))return;

  const {error}=await sb.from("match_games").update({
    set1_home:null,set1_away:null,
    set2_home:null,set2_away:null,
    set3_home:null,set3_away:null,
    winner:null,status:"planned"
  }).eq("id",id);

  if(error){
    showStatus($("editorStatus"),"Ergebnis konnte nicht gelöscht werden: "+errorText(error),"bad");
    return;
  }

  await updateOverallMatchStatus();
  selectedGames=await getGames(selectedMatch.id);
  renderEditor();
  showStatus($("editorStatus"),`${LABELS[g.position]||g.position}: Ergebnis gelöscht.`,"ok");
  await loadMatches();
}

async function setMatchStatus(status){
  if(!selectedMatch)return;
  const {error}=await sb.rpc("set_match_status",{p_match_id:selectedMatch.id,p_status:status});
  if(error){
    showStatus($("editorStatus"),"Begegnungsstatus konnte nicht gespeichert werden: "+errorText(error),"bad");
    return;
  }
  selectedMatch.status=status;
  const idx=matches.findIndex(m=>m.id===selectedMatch.id);
  if(idx>=0)matches[idx].status=status;
  renderEditor();
  await loadMatches();
  showStatus($("editorStatus"),`Begegnungsstatus: ${statusLabel(status)}.`,"ok");
}

async function updateOverallMatchStatus(){
  const games=await getGames(selectedMatch.id);
  const done=finishedCount(games);
  let status=selectedMatch.status;

  if(done===8)status="finished";
  else if(games.some(g=>g.status==="live" || gameIsTouched(g)))status="live";
  else status="planned";

  const {error}=await sb.rpc("set_match_status",{p_match_id:selectedMatch.id,p_status:status});
  if(!error){
    selectedMatch.status=status;
    const idx=matches.findIndex(m=>m.id===selectedMatch.id);
    if(idx>=0)matches[idx].status=status;
  }
}

async function loadAuthorizedScope(user){
  const [{data:teamRoles,error:rolesError},{data:clubManagerRows,error:clubManagerError}] = await Promise.all([
    sb.from("club_team_user_roles").select("club_id,team_id,role,status").eq("user_id",user.id).eq("status","active"),
    sb.from("club_managers").select("club_id").eq("user_id",user.id)
  ]);
  if(rolesError)throw new Error("Teamrechte konnten nicht geladen werden: "+rolesError.message);
  if(clubManagerError)throw new Error("Vereinsrechte konnten nicht geladen werden: "+clubManagerError.message);

  isAdmin=currentProfile.role==="admin";
  const scoringRoles=new Set(["moderator","scorer","team_manager"]);
  const scoringRows=(teamRoles||[]).filter(row=>scoringRoles.has(String(row.role||"").toLowerCase()));
  const managerClubIds=[...new Set((clubManagerRows||[]).map(row=>row.club_id).filter(Boolean))];
  const assignedTeamIds=[...new Set(scoringRows.map(row=>row.team_id).filter(Boolean))];
  const globalAllowed=isAdmin || ["moderator","scorer"].includes(currentProfile.role);

  if(!globalAllowed && !managerClubIds.length && !assignedTeamIds.length){
    throw new Error("Für diesen Account liegen keine Moderator-, Scorer-, Mannschaftsführer- oder Vereinsmanagerrechte vor.");
  }

  let clubs=[], teams=[];
  if(isAdmin){
    const [{data:allClubs,error:clubsError},{data:allTeams,error:teamsError}]=await Promise.all([
      sb.from("clubs").select("id,name").is("archived_at",null).order("name"),
      sb.from("club_teams").select("id,club_id,name,season,is_active").eq("is_active",true).order("name")
    ]);
    if(clubsError)throw new Error("Vereine konnten nicht geladen werden: "+clubsError.message);
    if(teamsError)throw new Error("Mannschaften konnten nicht geladen werden: "+teamsError.message);
    clubs=allClubs||[]; teams=allTeams||[];
  }else{
    const clubIds=new Set(managerClubIds);
    scoringRows.forEach(row=>{if(row.club_id)clubIds.add(row.club_id);});
    if(clubIds.size){
      const {data:clubRows,error:clubsError}=await sb.from("clubs")
        .select("id,name").in("id",[...clubIds]).is("archived_at",null).order("name");
      if(clubsError)throw new Error("Berechtigte Vereine konnten nicht geladen werden: "+clubsError.message);
      clubs=clubRows||[];
    }
    const teamMap=new Map();
    if(managerClubIds.length){
      const {data:clubTeams,error:clubTeamsError}=await sb.from("club_teams")
        .select("id,club_id,name,season,is_active").in("club_id",managerClubIds).eq("is_active",true);
      if(clubTeamsError)throw new Error("Vereinsmannschaften konnten nicht geladen werden: "+clubTeamsError.message);
      (clubTeams||[]).forEach(team=>teamMap.set(team.id,team));
    }
    if(assignedTeamIds.length){
      const {data:roleTeams,error:roleTeamsError}=await sb.from("club_teams")
        .select("id,club_id,name,season,is_active").in("id",assignedTeamIds).eq("is_active",true);
      if(roleTeamsError)throw new Error("Zugeordnete Mannschaften konnten nicht geladen werden: "+roleTeamsError.message);
      (roleTeams||[]).forEach(team=>teamMap.set(team.id,team));
    }
    teams=[...teamMap.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name),"de"));
    const missingClubIds=[...new Set(teams.map(team=>team.club_id).filter(id=>id&&!clubs.some(club=>club.id===id)))];
    if(missingClubIds.length){
      const {data:extraClubs}=await sb.from("clubs").select("id,name").in("id",missingClubIds);
      (extraClubs||[]).forEach(club=>clubs.push(club));
    }
  }

  authorizedClubs=clubs;
  authorizedTeams=teams;
  fillSelect($("clubFilter"),authorizedClubs,"Alle berechtigten Vereine");
  fillSelect($("teamFilter"),authorizedTeams,"Alle berechtigten Mannschaften");
  if(authorizedClubs.length===1){
    $("clubFilter").value=authorizedClubs[0].id;
    updateTeamOptions();
  }else renderMatches();
}

async function enterApp(user){
  try{
    currentUser=user;
    currentProfile=await loadProfile(user);
    await loadAuthorizedScope(user);
    $("matchSelectionCard").classList.remove("hidden");

    showStatus($("appStatus"),"Berechtigungen geladen. Es werden nur Begegnungen angezeigt, für die dieser Account eine Scoring-Berechtigung besitzt.","ok");
    await loadMatches();
  }catch(e){
    currentUser=null; currentProfile=null;
    $("matchSelectionCard").classList.add("hidden");

    $("matches").innerHTML="";
    $("editorCard").classList.add("hidden");
  }
}

$("clubFilter").addEventListener("change",()=>{
  $("teamFilter").value="";
  updateTeamOptions();
});
$("teamFilter").addEventListener("change",renderMatches);
$("statusFilter").addEventListener("change",renderMatches);

sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==="SIGNED_IN"&&session?.user&&!currentUser) await enterApp(session.user);
  if(event==="SIGNED_OUT"){
    currentUser=null; currentProfile=null; isAdmin=false;
    authorizedClubs=[]; authorizedTeams=[]; allMatches=[]; matches=[];
    selectedMatch=null; selectedGames=[];
    $("matchSelectionCard").classList.add("hidden");

    $("editorCard").classList.add("hidden");
    $("matches").innerHTML="";

  }
});

(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user) await enterApp(session.user);

})();
</script>

<script id="moderator-profile-menu">
(function () {
  const button = document.getElementById("profileBtn");
  const menu = document.getElementById("profileMenu");
  const login = document.getElementById("profileLogin");
  const register = document.getElementById("profileRegister");
  const manage = document.getElementById("profileManage");
  const logout = document.getElementById("logoutBtn");
  if (!button || !menu) return;

  function closeMenu() {
    menu.hidden = true;
    button.setAttribute("aria-expanded", "false");
  }

  function openMenu() {
    menu.hidden = false;
    button.setAttribute("aria-expanded", "true");
  }

  button.addEventListener("click", function (event) {
    event.preventDefault();
    event.stopPropagation();
    if (menu.hidden) openMenu();
    else closeMenu();
  });

  menu.addEventListener("click", function (event) {
    event.stopPropagation();
  });

  document.addEventListener("click", function (event) {
    if (!event.target.closest(".pn-profile-wrap")) closeMenu();
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeMenu();
      button.focus();
    }
  });

  function renderSession(session) {
    const signedIn = !!(session && session.user);
    if (login) login.hidden = signedIn;
    if (register) register.hidden = signedIn;
    if (manage) {
      manage.hidden = !signedIn;
      manage.textContent = "Profil / Kontoeinstellungen";
      manage.href = "profil.html";
    }
    if (logout) logout.hidden = !signedIn;
    closeMenu();
  }

  if (login) {
    login.addEventListener("click", function () {
      window.location.href = "login.html?return=moderator.html";
    });
  }
  if (register) {
    register.addEventListener("click", function () {
      window.location.href = "login.html?return=moderator.html&mode=register";
    });
  }
  if (logout) {
    logout.addEventListener("click", async function () {
      logout.disabled = true;
      try {
        const result = await sb.auth.signOut();
        if (result && result.error) throw result.error;
        closeMenu();
      } catch (error) {
        console.error("[BadminOne Profil] Abmelden fehlgeschlagen:", error);
        alert("Abmelden war nicht möglich: " + (error.message || "Unbekannter Fehler"));
      } finally {
        logout.disabled = false;
      }
    });
  }

  // Initial state and subsequent sign-in/sign-out updates.
  sb.auth.getSession().then(function (result) {
    renderSession(result && result.data ? result.data.session : null);
  }).catch(function (error) {
    console.warn("[BadminOne Profil] Sitzung konnte nicht gelesen werden:", error);
    renderSession(null);
  });

  sb.auth.onAuthStateChange(function (_event, session) {
    renderSession(session);
  });
})();
</script>
